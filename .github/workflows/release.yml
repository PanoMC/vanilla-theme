name: Pano Vanilla Theme Release

on:
  push:
    branches: ["dev", "master"]

# The called workflow's jobs request these; a reusable workflow cannot be
# granted more than the caller allows, so the caller must allow them all.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

# One release per branch at a time: a second push waits, so its version is computed after the first one is tagged.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Shared theme pipeline from the engine repo: version-override + license-server
    # switches live there once, and packaging uses the DETERMINISTIC zip (its
    # sha256 is the premium license identity).
    uses: PanoMC/sdk/.github/workflows/theme-release.yml@3326679f6c9dc31ece2f1fff10e35c820e4ea07e # dev; a commit, not the moving branch
    with:
      theme-id: vanilla-theme
    secrets:
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      PANO_TOKEN: ${{ secrets.PANO_TOKEN }}
      PANO_PROD_TOKEN: ${{ secrets.PANO_PROD_TOKEN }}
